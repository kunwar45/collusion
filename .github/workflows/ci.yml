name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run collusion-eval leak-check
      - run: uv run pytest -m "not docker"
  smoke:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: docker compose -f sandbox/compose.yaml build
      - run: docker compose -f scenarios/saas_v1/sandbox/compose.yaml build
      - run: uv run pytest -m docker
